{% extends 'notes/base.html' %}

{% block content %}

<h2>Мои заметки</h2>

<div class="row">
    {% for note in notes %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>{{ note.title }}</h5>
                <p>{{ note.text|truncatechars:100 }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
