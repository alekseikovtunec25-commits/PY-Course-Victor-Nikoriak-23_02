{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body>

<h1>Мои заметки</h1>

<div class="container">
    {% for note in notes %}
        <div class="card">
            <h2>{{ note.title }}</h2>
            <p>{{ note.text }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
