<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
</head>
<body>

<h1>My Notes</h1>

{% for note in notes %}
    <div style="border:1px solid black; margin:10px; padding:10px;">
        <h2>{{ note.title }}</h2>
        <p>{{ note.text }}</p>
        <p><b>Category:</b> {{ note.category.title }}</p>
        <p><b>Reminder:</b> {{ note.reminder }}</p>
    </div>
{% endfor %}

</body>
</html>
